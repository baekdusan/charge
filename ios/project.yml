name: Charge
options:
  bundleIdPrefix: com.dusan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 재생성 시에도 서명 팀 유지 (오픈소스 사용자는 자기 팀 ID로 교체)
    DEVELOPMENT_TEAM: 27AD4X6UKW
    CODE_SIGN_STYLE: Automatic
targets:
  Charge:
    type: application
    platform: iOS
    sources:
      - Charge
      - Shared
    info:
      path: Charge/Info.plist
      properties:
        CFBundleDisplayName: Charge
        # 런치스크린을 앱 배경(#111214)과 맞춰 흰 화면 번쩍임 제거
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusan.charge
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Charge/Charge.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dusan.charge
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - target: ChargeWidget
    scheme:
      testTargets:
        - ChargeUITests
      gatherCoverageData: false
  # 스크린샷 자동화 전용 (App Store 스크린샷을 데모 모드로 촬영) — 앱 배포에는 포함되지 않는다
  ChargeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ChargeUITests
    dependencies:
      - target: Charge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusan.charge.uitests
        TEST_TARGET_NAME: Charge
        GENERATE_INFOPLIST_FILE: YES

  ChargeWidget:
    type: app-extension
    platform: iOS
    sources:
      - ChargeWidget
      - Shared
    info:
      path: ChargeWidget/Info.plist
      properties:
        CFBundleDisplayName: Charge Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusan.charge.widget
        SKIP_INSTALL: YES
    entitlements:
      path: ChargeWidget/ChargeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dusan.charge
