name: Charge
options:
  bundleIdPrefix: com.dusan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 재생성 시에도 서명 팀 유지 (오픈소스 사용자는 자기 팀 ID로 교체)
    DEVELOPMENT_TEAM: 27AD4X6UKW
    CODE_SIGN_STYLE: Automatic
targets:
  Charge:
    type: application
    platform: iOS
    sources:
      - Charge
      - Shared
    info:
      path: Charge/Info.plist
      properties:
        CFBundleDisplayName: Charge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusan.charge
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Charge/Charge.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dusan.charge
    dependencies:
      - target: ChargeWidget
    scheme:
      testTargets: []
      gatherCoverageData: false
  ChargeWidget:
    type: app-extension
    platform: iOS
    sources:
      - ChargeWidget
      - Shared
    info:
      path: ChargeWidget/Info.plist
      properties:
        CFBundleDisplayName: Charge Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusan.charge.widget
        SKIP_INSTALL: YES
    entitlements:
      path: ChargeWidget/ChargeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dusan.charge
