name: collector-check

# macOS 개발 환경에서는 확인할 수 없는 경로를 검증한다.
# Windows: PowerShell 실행 정책, 작업 스케줄러 등록과 principal, 한글 인코딩, npx 실행.
# Linux/WSL: launchctl 대신 systemd 타이머(없으면 cron 안내)로 등록되는지.
on:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/collector-check.yml'
  pull_request:
    paths:
      - 'collector/**'
      - '.github/workflows/collector-check.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 환경 확인
        run: |
          node -v
          Write-Host "USERPROFILE=$env:USERPROFILE"
          Write-Host "ExecutionPolicy=$(Get-ExecutionPolicy)"
          # HOME 이 미설정인지 빈 문자열인지 구분한다.
          # 빈 문자열이면 `process.env.HOME ?? process.env.USERPROFILE` 가 폴백하지 않고
          # ""를 그대로 써서 ~/.charge 가 상대경로 ".charge" 로 잡힌다.
          node -e "console.log('HOME=' + JSON.stringify(process.env.HOME), 'USERPROFILE=' + JSON.stringify(process.env.USERPROFILE))"
          node -e "const p=require('path');console.log('CONF_DIR =', p.join(process.env.HOME ?? process.env.USERPROFILE, '.charge'))"

      # ── 1. 유닛 테스트 ────────────────────────────────────────────────
      - name: collect.test.js
        working-directory: collector
        run: node --test collect.test.js

      # ── 2. CLI 진입점 ────────────────────────────────────────────────
      - name: cli.js — 인자 없이 실행하면 사용법 + exit 1
        working-directory: collector
        run: |
          $out = node cli.js 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1) { throw "exit code 기대값 1, 실제 $code" }
          if ($out -notmatch 'charge-connect') { throw "사용법 문구가 안 나옴" }
          exit 0   # node 의 exit 1 이 스텝 결과로 새어나가지 않게

      - name: cli.js unpair — CHARGE_HOME 아래 config.json 제거
        working-directory: collector
        env:
          CHARGE_HOME: ${{ runner.temp }}\charge-home
        run: |
          New-Item -ItemType Directory -Force -Path $env:CHARGE_HOME | Out-Null
          '{"url":"http://x","anon":"y","token":"z"}' | Set-Content "$env:CHARGE_HOME\config.json"
          node cli.js unpair
          if ($LASTEXITCODE -ne 0) { throw "unpair 실패 ($LASTEXITCODE)" }
          if (Test-Path "$env:CHARGE_HOME\config.json") { throw "config.json이 안 지워짐" }

      # ── 3. 수집 본체 (npx/.cmd 셔틀 경로를 실제로 태운다) ─────────────
      - name: collect.js --dry-run
        working-directory: collector
        timeout-minutes: 12
        env:
          CHARGE_DISABLE_CODEXBAR: '1'
        run: |
          $out = node collect.js --dry-run 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dry-run이 exit $LASTEXITCODE 로 죽음" }
          if ($out -notmatch 'dry-run') { throw "dry-run 요약 줄이 없음" }

      - name: collect.js — 페어링 없이 업로드하면 안내 후 exit 1
        working-directory: collector
        timeout-minutes: 12
        env:
          CHARGE_DISABLE_CODEXBAR: '1'
          CHARGE_HOME: ${{ runner.temp }}\empty-home
        run: |
          $out = node collect.js 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1) { throw "exit code 기대값 1, 실제 $code" }
          if ($out -notmatch '페어링') { throw "페어링 안내 문구가 없음" }
          exit 0

      # ── 4. 작업 스케줄러 등록 ────────────────────────────────────────
      # cli.js 는 powershell.exe(= Windows PowerShell 5.1)를 부른다. 5.1 은 BOM 없는 파일을
      # 시스템 ANSI 코드페이지로 읽어서 한글 안내가 전부 깨진다. 근본 원인은 파일 인코딩이므로
      # 바이트로 검사하고, 5.1 이 실제로 온전히 읽는지도 확인한다.
      - name: install.ps1 한글 인코딩 (Windows PowerShell 5.1)
        working-directory: collector
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('install.ps1');if(b[0]!==0xEF||b[1]!==0xBB||b[2]!==0xBF)throw new Error('UTF-8 BOM 없음 — PS 5.1이 한글을 깨뜨린다');if(!b.toString('utf8').includes('등록 완료'))throw new Error('한글 문구 손상');console.log('BOM + 한글 OK')"
          # 명령줄에 한글을 싣지 않으려고 코드포인트로 비교하고, 결과는 UTF-8 파일로 받는다
          $cmd = '$s = Get-Content -Raw .\install.ps1; $t = [char]0xB4F1 + [char]0xB85D; $r = if ($s -match $t) { "KO-OK" } else { "KO-BROKEN" }; $r | Out-File -Encoding utf8 ko-probe.txt'
          powershell -NoProfile -ExecutionPolicy Bypass -Command $cmd
          $r = (Get-Content ko-probe.txt -Raw).Trim()
          Write-Host "probe=$r"
          if ($r -ne 'KO-OK') { throw "Windows PowerShell 5.1이 install.ps1의 한글을 못 읽는다" }
          Remove-Item -Force ko-probe.txt

      - name: install.ps1 — 스케줄 등록
        working-directory: collector
        run: |
          $out = powershell -ExecutionPolicy Bypass -File .\install.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "install.ps1 실패 ($code)" }
          # 러너는 관리자라 S4U 가 통해야 한다. 폴백이 걸렸다면 실행 확인 로직이 오탐한 것이다.
          if ($out -match '대화형 모드로 되돌립니다') { throw "S4U 실행 확인이 실패해 폴백이 걸렸다" }
          if ($out -notmatch '등록 완료') { throw "등록 완료 문구가 없음" }

      - name: 등록된 작업 점검 (콘솔 창 노출 여부 포함)
        run: |
          $t = Get-ScheduledTask -TaskName ChargeConnect -ErrorAction Stop
          $a = $t.Actions[0]
          Write-Host "Execute   : $($a.Execute)"
          Write-Host "Arguments : $($a.Arguments)"
          Write-Host "LogonType : $($t.Principal.LogonType)"
          Write-Host "RunLevel  : $($t.Principal.RunLevel)"
          Write-Host "Hidden    : $($t.Settings.Hidden)"
          Write-Host "Repetition: $($t.Triggers[0].Repetition.Interval) / $($t.Triggers[0].Repetition.Duration)"

          if ($t.Triggers[0].Repetition.Interval -ne 'PT5M') {
            throw "5분 간격이 아님: $($t.Triggers[0].Repetition.Interval)"
          }
          # LogonType Interactive + cmd.exe = 5분마다 콘솔 창이 뜬다는 뜻
          if ($t.Principal.LogonType -eq 'Interactive') {
            throw "LogonType이 Interactive다 — 5분마다 콘솔 창이 깜빡인다"
          }
          if ($t.Principal.LogonType -ne 'S4U') {
            throw "LogonType 기대값 S4U, 실제 $($t.Principal.LogonType)"
          }

      - name: 등록된 명령줄이 실제로 도는지 (인자 검증)
        timeout-minutes: 15
        run: |
          $a = (Get-ScheduledTask -TaskName ChargeConnect).Actions[0]
          $log = Join-Path $env:USERPROFILE ".charge\collector.log"
          if (Test-Path (Join-Path $env:USERPROFILE "charge-connect.log")) {
            throw "예전 위치의 로그가 안 지워짐"
          }
          # 셸을 거치면 경로의 %VAR% 확장·리다이렉션 실패를 떠안는다. node 를 직접 불러야 한다.
          if ($a.Execute -match 'cmd\.exe|powershell') { throw "셸을 거쳐 실행하고 있다: $($a.Execute)" }

          # install.ps1 이 S4U 동작 확인을 위해 작업을 이미 한 번 띄워놨다. 그게 끝나기를
          # 기다려야 한다 — 겹치면 cmd 의 리다이렉션이 실패해 이 검증이 엉뚱한 이유로 통과한다.
          # Disable 하면 State 가 'Disabled' 로 바뀌어 실행 중 여부를 못 읽으므로,
          # 작업 상태 대신 로그 파일의 잠금이 풀리는지를 직접 본다.
          Disable-ScheduledTask -TaskName ChargeConnect | Out-Null
          Stop-ScheduledTask -TaskName ChargeConnect -ErrorAction SilentlyContinue
          $deadline = (Get-Date).AddMinutes(8)
          while ((Get-Date) -lt $deadline) {
            if (-not (Test-Path $log)) { break }
            try {
              [System.IO.File]::Open($log, 'Open', 'ReadWrite', 'None').Close()
              break
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not (Test-Path $log)) { throw "install.ps1 의 실행 확인이 로그를 안 남겼다" }
          Remove-Item -Force $log

          # 스케줄러가 넣는 것과 동일한 인자로 직접 실행
          $p = Start-Process -FilePath $a.Execute -ArgumentList $a.Arguments -NoNewWindow -Wait -PassThru
          if (-not (Test-Path $log)) { throw "로그 파일이 안 생김 → --log 인자가 안 먹었다" }
          $content = Get-Content $log -Raw
          Write-Host "--- collector.log ---"
          Write-Host $content
          if ($content -notmatch '수집 시작') { throw "시작 줄이 없다 — 실행 확인의 근거가 사라진다" }
          if ($content -notmatch '페어링') { throw "collect.js 출력이 로그에 안 잡혔다" }
          # 페어링이 없으니 exit 1 이 정상. 그 외 코드는 경로/인자 문제를 의심한다.
          Write-Host "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 1) { throw "기대값 1(미페어링), 실제 $($p.ExitCode)" }

      - name: 로그 로테이션 (5MB 초과)
        working-directory: collector
        timeout-minutes: 12
        env:
          CHARGE_DISABLE_CODEXBAR: '1'
          CHARGE_HOME: ${{ runner.temp }}\rot
        run: |
          New-Item -ItemType Directory -Force -Path $env:CHARGE_HOME | Out-Null
          $log = Join-Path $env:CHARGE_HOME "collector.log"
          $fs = [System.IO.File]::Create($log); $fs.SetLength(6MB); $fs.Close()
          node collect.js --log $log
          if (-not (Test-Path ($log + '.old'))) { throw "5MB 초과인데 .old 로 안 밀렸다" }
          if ((Get-Item $log).Length -gt 1MB) { throw "새 로그가 초기화되지 않았다" }
          Write-Host (Get-Content $log -Raw)
          exit 0

      # 러너의 기본 경로는 공백도 비ASCII도 없다. 실사용 경로는 그렇지 않다.
      - name: install.ps1 — 공백·한글·괄호가 든 경로 + PowerShell 7 직접 실행
        working-directory: collector
        timeout-minutes: 15
        env:
          CHARGE_HOME: '${{ runner.temp }}\charge 한글 경로 (test)'
        run: |
          Unregister-ScheduledTask -TaskName ChargeConnect -Confirm:$false -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:CHARGE_HOME | Out-Null
          $out = pwsh -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 실패 ($LASTEXITCODE)" }
          if ($out -match '되돌립니다') { throw "특수 경로에서 S4U 실행 확인이 실패했다" }
          $log = Join-Path $env:CHARGE_HOME "collector.log"
          if (-not (Test-Path $log)) { throw "특수 경로에 로그가 안 생김: $log" }
          Write-Host (Get-Content $log -Raw)

      - name: task가 가리키는 경로 기록
        run: |
          # install.ps1 은 자기 자신이 놓인 자리에서 collect.js 를 찾는다.
          # 실사용 경로는 cli.js 가 복사해두는 ~/.charge/app 이다.
          Write-Host (Get-ScheduledTask -TaskName ChargeConnect).Actions[0].Arguments

      # ── 5. Node 없는 환경에서의 실패 메시지 ──────────────────────────
      - name: install.ps1 — PATH에 node가 없을 때
        working-directory: collector
        run: |
          $out = powershell -ExecutionPolicy Bypass -Command "`$env:PATH='C:\Windows\System32'; & '.\install.ps1'" 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'Get-Command|CommandNotFoundException') {
            throw "node가 없으면 PowerShell 원문 에러가 그대로 노출된다"
          }
          if ($out -notmatch 'nodejs\.org') { throw "Node.js 설치 안내가 없음" }
          exit 0

      - name: 정리
        if: always()
        run: Unregister-ScheduledTask -TaskName ChargeConnect -Confirm:$false -ErrorAction SilentlyContinue

  # Windows 개발자 상당수가 WSL 안에서 작업한다. 거기선 install.sh 의 launchctl 이 없다.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: collect.test.js
        working-directory: collector
        run: node --test collect.test.js

      # 경로에 공백을 넣어 돌린다 — systemd 는 ExecStart 를 공백으로 쪼개므로
      # 인용이 빠지면 --log 인자가 두 동강 난다.
      - name: install.linux.sh — 등록 결과 검증 (공백 든 경로)
        working-directory: collector
        env:
          CHARGE_HOME: '${{ runner.temp }}/charge home (test)'
        run: |
          if grep -q launchctl install.linux.sh; then
            echo "launchctl 호출이 남아 있다"; exit 1
          fi
          bash -n install.linux.sh
          mkdir -p "$CHARGE_HOME"
          set +e
          out=$(bash install.linux.sh 2>&1); code=$?
          set -e
          echo "$out"
          echo "exit=$code"
          log="$CHARGE_HOME/collector.log"
          if [ "$code" = "0" ]; then
            unit="$HOME/.config/systemd/user/charge-connect.service"
            [ -f "$unit" ] || { echo "service 유닛이 없다"; exit 1; }
            cat "$unit"
            grep -qF -- "--log \"$log\"" "$unit" || { echo "공백 경로가 인용되지 않았다"; exit 1; }
            systemctl --user is-enabled charge-connect.timer
            # 타이머가 아니라 서비스를 직접 한 번 돌려 유닛이 실제로 실행 가능한지 본다
            systemctl --user start charge-connect.service || true
            for _ in $(seq 1 30); do [ -f "$log" ] && break; sleep 1; done
            [ -f "$log" ] || { echo "유닛이 로그를 안 남겼다 — ExecStart 가 안 먹었다"; exit 1; }
            grep -q "수집 시작" "$log" || { echo "시작 줄이 없다"; exit 1; }
            cat "$log"
            systemctl --user disable --now charge-connect.timer
          elif [ "$code" = "3" ]; then
            # systemd 사용자 세션이 없는 환경 (WSL 등) — cron 안내가 나와야 한다
            echo "$out" | grep -q crontab || { echo "cron 안내가 없다"; exit 1; }
            echo "$out" | grep -qF -- "--log '$log'" || { echo "cron 줄의 경로가 인용되지 않았다"; exit 1; }
          else
            echo "예상 못한 종료 코드"; exit 1
          fi

      - name: cli.js 가 리눅스용 스크립트를 고르고 패키지에도 들어간다
        working-directory: collector
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.readFileSync('cli.js', 'utf8').includes('install.linux.sh')) {
              throw new Error('cli.js 가 install.linux.sh 를 모른다');
            }
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!pkg.files.includes('install.linux.sh')) throw new Error('npm 패키지에 안 들어간다');
            console.log('OK');
          "

      - name: collect.js --dry-run
        working-directory: collector
        timeout-minutes: 12
        env:
          CHARGE_DISABLE_CODEXBAR: '1'
        run: node collect.js --dry-run
